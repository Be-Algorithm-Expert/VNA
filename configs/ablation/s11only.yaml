# S11-only sanity check: S22 is the unstable channel (two opposed "camps"
# across groups: 101/102/302 vs 201/202/301, cross-camp dB-curve corr is
# negative). This variant keeps ONLY the always-stable S11 to test how much
# of the LOGO collapse is caused by the S22 camp split.
# Derived from configs/ablation/full.yaml (same step chain, wider drop).

run_name: ablation_s11only

data:
  root: f:/H坏盘备份/VNA_Cls_2026/dataset_3_2_50_10
  processed_root: f:/H坏盘备份/VNA_Cls_2026/processed
  run_name: baseline_s21          # shared processed cache
  subjects: [S001, S002, S003]
  sessions: [SES01, SES02]
  domain: time

enhance:
  steps:
    - name: channel_select
      params:
        drop: [S_avg, S22]        # keep only S11

    - name: bootstrap_avg
      params:
        n_draws: 10
        seed: 0

    - name: diff_sub
      params:
        ref: group_median

    - name: diff_div
      params:
        ref: group_median
        mask_db: -60.0

    - name: ifft_window
      params:
        type: kaiser
        beta: 6.0

    - name: delay_align
      params: {}

    - name: early_gate
      params:
        depth_db: -20.0
        mode: crop
        quantile: 0.9

    - name: amp_norm
      params:
        mode: l2

    - name: step_crop
      params:
        frac: 0.01
